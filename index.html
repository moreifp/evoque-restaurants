    <!-- iOS Splash Screen Styles (shows before React loads) -->
    <style>
      /* Immediate splash screen for PWA launch */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        box-shadow: 0 8px 32px -8px rgba(26, 26, 26, 0.16);
      }
      #splash-screen h1 {
        margin-top: 16px;
        font-size: 24px;
        font-weight: 600;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, sans-serif;
        letter-spacing: -0.02em;
      }
      #splash-screen p {
        margin-top: 4px;
        font-size: 14px;
        color: #6b7280;
        font-family: system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #splash-screen {
          background: #0f1419;
        }
        #splash-screen h1 {
          color: #f5f5f4;
        }
        #splash-screen p {
          color: #9ca3af;
        }
      }
    </style>

  <body>
    <!-- Native splash screen (visible immediately on PWA launch) -->
    <div id="splash-screen">
      <img src="/app-icon.png" alt="Evoque" />
      <h1>Evoque</h1>
      <p>Keep the taste alive</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide splash screen once React app is ready
      function hideSplash() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() {
            splash.remove();
          }, 300);
        }
      }
      
      // Hide splash on load
      window.addEventListener('load', function() {
        setTimeout(hideSplash, 500);
      });
      
      // Fallback: hide splash after 3 seconds regardless
    setTimeout(hideSplash, 3000);
    </script>
    <script>
      // Google Maps auth failure handler
      window.gm_authFailure = function() {
        console.error('[Google Maps] Authentication failed - check API key restrictions');
        window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
      };
      
      // Google Maps callback - dispatches event when ready
      window.initGoogleMaps = function() {
        console.log('[Google Maps] API loaded successfully');
        console.log('[Google Maps] Maps available:', !!window.google?.maps?.Map);
        console.log('[Google Maps] Places available:', !!window.google?.maps?.places);
        window.dispatchEvent(new Event('google-maps-loaded'));
      };
      
      // Load Google Maps dynamically with cache busting
      window.__loadGoogleMaps = function(apiKey) {
        if (window.__googleMapsLoaded && window.google?.maps?.places) {
          console.log('[Google Maps] Already loaded');
          window.dispatchEvent(new Event('google-maps-loaded'));
          return;
        }
        
        var key = apiKey || window.__GOOGLE_MAPS_API_KEY__;
        if (!key) {
          console.error('[Google Maps] No API key provided');
          window.dispatchEvent(new CustomEvent('google-maps-load-error', { detail: 'No API key' }));
          return;
        }
        
        window.__googleMapsLoaded = true;
        window.__GOOGLE_MAPS_API_KEY__ = key;
        console.log('[Google Maps] Loading script...');
        
        // Remove any existing Google Maps script
        var existingScript = document.querySelector('script[src*="maps.googleapis.com"]');
        if (existingScript) {
          existingScript.remove();
        }
        
        var script = document.createElement('script');
        // Add cache buster to prevent PWA from serving stale version
        var cacheBuster = Date.now();
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + key + '&libraries=places&callback=initGoogleMaps&v=weekly&_cb=' + cacheBuster;
        script.async = true;
        script.defer = true;
        script.onerror = function() {
          console.error('[Google Maps] Failed to load script');
          window.__googleMapsLoaded = false;
          window.dispatchEvent(new CustomEvent('google-maps-load-error', { detail: 'Script load failed' }));
        };
        document.body.appendChild(script);
      };
      
      // Retry function for manual reload
      window.__retryGoogleMaps = function() {
        console.log('[Google Maps] Retrying...');
        window.__googleMapsLoaded = false;
        // Clear PWA cache for Google Maps
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (name.includes('google') || name.includes('maps')) {
                caches.delete(name);
                console.log('[Google Maps] Cleared cache:', name);
              }
            });
          });
        }
        // Reload after short delay
        setTimeout(function() {
          window.__loadGoogleMaps();
        }, 100);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
